<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofinance CI - Chat Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1a73e8; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 16px; }
        .chat-header .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .message.sent { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.received { background: #e8eaed; color: #202124; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message .info { font-size: 11px; opacity: 0.7; margin-top: 4px; display: block; }
        .typing { font-size: 12px; color: #666; padding: 4px 16px; font-style: italic; }
        .input-area { padding: 12px 16px; border-top: 1px solid #e8eaed; display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #dadce0; border-radius: 24px; outline: none; font-size: 14px; }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .login-form { padding: 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center; height: 100%; }
        .login-form input { width: 100%; padding: 10px 16px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; }
        .login-form button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .login-form h2 { color: #1a73e8; margin-bottom: 16px; }
        select.conversation-select { padding: 8px 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; width: 100%; }
        .top-bar { padding: 8px 16px; display: flex; gap: 8px; align-items: center; background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="chat-container" id="app">
        <div v-if="!token" class="login-form">
            <h2>Cofinance CI Chat</h2>
            <input type="text" v-model="username" placeholder="admin, agent1, client1..." @keyup.enter="login">
            <input type="password" v-model="password" placeholder="••••••••" @keyup.enter="login">
            <button @click="login">Connexion</button>
            <p style="color:red;font-size:13px">{{ error }}</p>
        </div>
        <template v-else>
            <div class="chat-header">
                <h3>Support Cofinance CI</h3>
                <span class="badge">{{ user.role }}</span>
            </div>
            <div class="top-bar">
                <select class="conversation-select" v-model="currentConversationId" @change="switchConversation">
                    <option value="" disabled>Sélectionnez une conversation</option>
                    <option v-for="conv in conversations" :key="conv.id" :value="conv.id">
                        {{ conv.client_name || conv.id }} ({{ conv.status }})
                    </option>
                </select>
                <button @click="newConversation" style="padding:6px 12px;background:#34a853;color:white;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;">Nouveau</button>
            </div>
            <div class="messages" ref="messagesContainer">
                <div v-for="msg in messages" :key="msg.id" :class="['message', msg.sender === user.username ? 'sent' : 'received']">
                    {{ msg.message }}
                    <span class="info">{{ msg.sender_name || msg.sender }} - {{ formatTime(msg.timestamp) }}</span>
                </div>
                <div v-if="typing" class="typing">Un agent écrit...</div>
            </div>
            <div class="input-area">
                <input type="text" v-model="newMessage" placeholder="Votre message..." @keyup.enter="sendMessage" :disabled="!currentConversationId">
                <button @click="sendMessage" :disabled="!newMessage.trim() || !currentConversationId">➤</button>
            </div>
        </template>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7/dist/vue.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                username: '',
                password: '',
                token: '',
                refresh: '',
                user: {},
                conversations: [],
                currentConversationId: null,
                messages: [],
                newMessage: '',
                error: '',
                socket: null,
                typing: false,
            },
            methods: {
                async login() {
                    try {
                        const res = await fetch('/api/auth/login/', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({username: this.username, password: this.password})
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.token = data.access;
                            this.refresh = data.refresh;
                            this.user = data.user;
                            this.loadConversations();
                        } else {
                            this.error = data.error || 'Erreur de connexion';
                        }
                    } catch(e) {
                        this.error = 'Erreur de connexion au serveur';
                    }
                },
                async loadConversations() {
                    const res = await fetch('/api/chat/conversations/', {
                        headers: {'Authorization': `Bearer ${this.token}`}
                    });
                    this.conversations = await res.json();
                    if (this.conversations.length > 0) {
                        this.currentConversationId = this.conversations[0].id;
                        this.loadMessages();
                        this.connectWebSocket();
                    }
                },
                async loadMessages() {
                    if (!this.currentConversationId) return;
                    const res = await fetch(`/api/chat/conversations/${this.currentConversationId}/messages/`, {
                        headers: {'Authorization': `Bearer ${this.token}`}
                    });
                    this.messages = await res.json();
                    this.$nextTick(() => this.scrollToBottom());
                },
                async newConversation() {
                    const res = await fetch('/api/chat/conversations/', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: '{}'
                    });
                    const conv = await res.json();
                    this.conversations.unshift(conv);
                    this.currentConversationId = conv.id;
                    this.messages = [];
                    this.connectWebSocket();
                },
                connectWebSocket() {
                    if (this.socket) this.socket.close();
                    this.socket = new WebSocket(`ws://localhost:8000/ws/chat/${this.currentConversationId}/`);
                    this.socket.onmessage = (e) => {
                        const data = JSON.parse(e.data);
                        this.messages.push({
                            message: data.message,
                            sender: data.sender,
                            sender_name: data.sender_name,
                            timestamp: data.timestamp,
                            id: Date.now()
                        });
                        this.$nextTick(() => this.scrollToBottom());
                    };
                },
                sendMessage() {
                    if (!this.newMessage.trim() || !this.currentConversationId) return;
                    if (this.socket && this.socket.readyState === WebSocket.OPEN) {
                        this.socket.send(JSON.stringify({message: this.newMessage}));
                        this.newMessage = '';
                    }
                },
                switchConversation() {
                    this.loadMessages();
                    this.connectWebSocket();
                },
                formatTime(ts) {
                    if (!ts) return '';
                    const d = new Date(ts);
                    return d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                },
                scrollToBottom() {
                    const container = this.$refs.messagesContainer;
                    if (container) container.scrollTop = container.scrollHeight;
                }
            }
        });
    </script>
</body>
</html>

                            <button v-if="canTransition(selectedLoan, 'reject')" class="btn btn-sm btn-danger" @click="updateLoanStatus(selectedLoan, 'REJETEE')">
                                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Rejeter
                            </button>
                            <button v-if="canTransition(selectedLoan, 'disburse')" class="btn btn-sm btn-primary" @click="updateLoanStatus(selectedLoan, 'DECAISSEE')">
                                <svg viewBox="0 0 24 24"><path d="M12 1v22M17 5l-5-4-5 4"/></svg> Décaisser
                            </button>
                        </div>
                        <button class="btn btn-sm btn-outline" @click="selectedLoan = null">Fermer</button>
                    </div>
                </div>
            </div>

            <div class="modal-overlay" v-if="confirm.show" @click.self="confirm.show=false">
                <div class="modal" style="max-width:400px">
                    <div class="confirm-modal">
                        <div :class="['confirm-icon', confirm.danger ? 'danger' : 'warning']">
                            <svg v-if="confirm.danger" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                            <svg v-else viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        </div>
                        <h4>{{ confirm.title }}</h4>
                        <p>{{ confirm.message }}</p>
                        <div class="confirm-actions">
                            <button class="btn btn-outline" @click="confirm.show=false">Annuler</button>
                            <button :class="['btn', confirm.danger ? 'btn-danger' : 'btn-primary']" @click="confirm.onConfirm();confirm.show=false">Confirmer</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="notification" v-if="notif.show" :class="notif.type" @click="notif.show = false">
                <svg v-if="notif.type === 'success'" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                <svg v-else viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                {{ notif.message }}
            </div>
        </template>
        {% endverbatim %}
    </div>
    <script>
        new Vue({
            el: '#app',
            data: {
                theme: localStorage.getItem('theme') || 'light',
                token: localStorage.getItem('token') || '',
                refresh: '',
                user: {},
                username: '',
                password: '',
                error: '',
                loading: false,
                sidebarOpen: false,
                currentView: 'dashboard',
                dashboardStats: [],
                recentLoans: [],
                loans: [],
                repayments: [],
                insuranceProducts: [],
                myPolicies: [],
                conversations: [],
                selectedChat: null,
                chatMessages: [],
                chatInput: '',
                chatTyping: [],
                chatOnline: {},
                chatSocket: null,
                notifSocket: null,
                _refreshTimer: null,
                notifications: [],
                notificationsList: [],
                users: [],
                auditLogs: [],
                showLoanForm: false,
                showInsuranceForm: false,
                selectedLoan: null,
                loanForm: { montant_demande: '', duree_mois: 12, motif: '', revenu_mensuel: '' },
                chartData: { months: [], credits_par_mois: [], remboursements_par_mois: [], repartition_statuts: [], top_agents: [] },
                insuranceForm: { produit_id: '' },
                notif: { show: false, message: '', type: 'success' },
                searchQuery: '',
                searchResults: [],
                searchTimeout: null,
                loanFilter: 'all',
                dashboardPeriod: '30d',
                filterPeriods: [{value:'7d',label:'7j'},{value:'30d',label:'30j'},{value:'90d',label:'90j'}],
                loanFilters: [{value:'all',label:'Tous'},{value:'SOUMISE',label:'Soumises'},{value:'EN_ANALYSE',label:'En analyse'},{value:'APPROUVEE',label:'Approuvées'},{value:'REJETEE',label:'Rejetées'},{value:'DECAISSEE',label:'Décaissées'}],
                loadingViews: {dashboard:true,loans:true,repayments:true,insurance:true,chat:true,notifications:true,users:true,audit:true},
                profileForm: { first_name:'', last_name:'' },
                passwordForm: { old_password:'', new_password:'', confirm_password:'' },
                passwordError: '',
                confirm: { show:false, title:'', message:'', danger:false, onConfirm:()=>{} },
                loanPage: 1, repayPage: 1, userPage: 1, auditPage: 1,
                pageSize: 10,
                searchIndex: -1,
            },
            computed: {
                menuItems() {
                    const items = [
                        { id: 'dashboard', iconSvg: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>', label: 'Tableau de bord', badge: null },
                        { id: 'loans', iconSvg: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>', label: 'Crédits', badge: null },
                        { id: 'repayments', iconSvg: '<svg viewBox="0 0 24 24"><path d="M12 1v22M17 5l-5-4-5 4"/></svg>', label: 'Remboursements', badge: null },
                        { id: 'insurance', iconSvg: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>', label: 'Assurance', badge: null },
                        { id: 'chat', iconSvg: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>', label: 'Chat', badge: () => this.unreadChatCount },
                        { id: 'notifications', iconSvg: '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>', label: 'Notifications', badge: () => this.unreadNotifCount },
                    ];
                    if (this.user.role === 'ADMIN') {
                        items.push({ id: 'users', iconSvg: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>', label: 'Utilisateurs', badge: null });
                        items.push({ id: 'audit', iconSvg: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>', label: 'Audit', badge: null });
                    }
                    return items;
                },
                currentViewTitle() {
                    const map = { dashboard:'Tableau de bord', loans:'Crédits', repayments:'Remboursements', insurance:'Assurance', chat:'Support Chat', notifications:'Notifications', users:'Utilisateurs', audit:'Journal d\'audit' };
                    return map[this.currentView] || 'Cofinance CI';
                },
                unreadChatCount() { return this.conversations.reduce((s, c) => s + (c.unread_count || 0), 0); },
                unreadNotifCount() { return this.notificationsList.filter(n => !n.lu).length; },
                filteredLoans() {
                    if (this.loanFilter === 'all') return this.loans;
                    return this.loans.filter(l => l.statut === this.loanFilter);
                },
                paginatedLoans() { const s=this.pageSize; return this.filteredLoans.slice((this.loanPage-1)*s, this.loanPage*s); },
                paginatedUsers() { const s=this.pageSize; return this.users.slice((this.userPage-1)*s, this.userPage*s); },
                loanPages() { return Array.from({length:Math.ceil(this.filteredLoans.length/this.pageSize)},(_,i)=>i+1); },
                auditPages() { return Array.from({length:Math.ceil(this.auditLogs.length/this.pageSize)},(_,i)=>i+1); },
                repayPages() { return Math.max(1, Math.ceil(this.repayments.length/this.pageSize)); },
                userPages() { return Math.max(1, Math.ceil(this.users.length/this.pageSize)); },
                paginatedAudit() { const s=this.pageSize; return this.auditLogs.slice((this.auditPage-1)*s, this.auditPage*s); },
                paginatedRepayments() { const s=this.pageSize; return this.repayments.slice((this.repayPage-1)*s, this.repayPage*s); },
            },
            methods: {
                async login() {
                    if (!this.username || !this.password) return;
                    this.loading = true; this.error = '';
                    try {
                        const r = await fetch('/api/auth/login/', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:this.username, password:this.password}) });
                        const d = await r.json();
                        if (!r.ok) { this.error = d.error || 'Erreur de connexion'; return; }
                        this.token = d.access; this.refresh = d.refresh; this.user = d.user;
                        this.user.initials = (d.user.first_name?.[0]||'') + (d.user.last_name?.[0]||'');
                        localStorage.setItem('token', this.token);
                        localStorage.setItem('refresh', this.refresh);
                        await this.loadAll();
                        this.startTokenRefresh();
                    } catch(e) { this.error = 'Erreur de connexion au serveur'; }
                    finally { this.loading = false; }
                },
                logout() { this.token = ''; this.user = {}; this.refresh = ''; this.notificationsList = []; this.conversations = []; if (this._refreshTimer) { clearInterval(this._refreshTimer); this._refreshTimer = null; } if (this.notifSocket) { this.notifSocket.onclose = null; this.notifSocket.close(); this.notifSocket = null; } if (this.chatSocket) { this.chatSocket.onclose = null; this.chatSocket.close(); this.chatSocket = null; } localStorage.removeItem('token'); localStorage.removeItem('refresh'); },
                toggleTheme() { this.theme = this.theme === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', this.theme); localStorage.setItem('theme', this.theme); },
                navigate(view) { this.currentView = view; this.sidebarOpen = false; this.searchQuery='';this.searchResults=[];this.searchIndex=-1; this.loadView(view); },
                async loadAll() { await Promise.all([this.loadDashboard(), this.loadLoans(), this.loadRepayments(), this.loadInsurance(), this.loadChat(), this.loadNotifications()]); if (this.user.role === 'ADMIN') { await this.loadUsers(); await this.loadAudit(); } this.connectNotificationSocket(); },
                async loadView(view) {
                    this.$set(this.loadingViews, view, true);
                    if (view === 'profile') { this.profileForm = { first_name:this.user.first_name||'', last_name:this.user.last_name||'' }; this.$set(this.loadingViews, view, false); return; }
                    if (view === 'dashboard') await this.loadDashboard();
                    if (view === 'loans') await this.loadLoans();
                    if (view === 'repayments') await this.loadRepayments();
                    if (view === 'insurance') await this.loadInsurance();
                    if (view === 'chat') await this.loadChat();
                    if (view === 'notifications') await this.loadNotifications();
                    if (view === 'users' && this.user.role === 'ADMIN') await this.loadUsers();
                    if (view === 'audit' && this.user.role === 'ADMIN') await this.loadAudit();
                    this.$set(this.loadingViews, view, false);
                },
                api(path) { return fetch(path, {headers:{'Authorization':`Bearer ${this.token}`}}).then(r => r.json()); },
                async loadDashboard() {
                try {
                    const role = this.user.role.toLowerCase();
                    const data = await this.api(`/api/dashboard/${role}/`);
                    if (role === 'admin') {
                        const chartResp = await this.api('/api/dashboard/charts/');
                        this.chartData = chartResp;
                        this.$nextTick(() => this.renderCharts());
                    }
                        if (this.user.role === 'ADMIN') {
                            this.dashboardStats = [
                                { iconSvg:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>', label:'Total crédits', value:data.credits?.total||0, color:'#1a73e8', sub:`${data.credits?.approuvees||0} approuvés`, change: 12 },
                                { iconSvg:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>', label:'Approuvés', value:data.credits?.approuvees||0, color:'#059669', sub:`${data.credits?.decaisses||0} décaissés`, change: 8 },
                                { iconSvg:'<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>', label:'Montant prêté', value:this.formatMoney(data.financier?.montant_prete||0), color:'#d97706' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>', label:'Remboursé', value:this.formatMoney(data.financier?.montant_rembourse||0), color:'#7c3aed', change: -3 },
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>', label:'Assurances actives', value:data.assurance?.souscriptions_actives||0, color:'#0891b2' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>', label:'Conversations', value:data.support?.total_conversations||0, color:'#dc2626', sub:`${data.support?.ouvertes||0} ouvertes` },
                            ];
                        } else if (this.user.role === 'CLIENT') {
                            this.dashboardStats = [
                                { iconSvg:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>', label:'Mes crédits', value:data.credits?.total||0, color:'#1a73e8' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>', label:'Crédits actifs', value:data.credits?.actifs||0, color:'#059669' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>', label:'Score', value:data.score_credit||0, color:'#d97706', sub:'/100' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>', label:'Notifications', value:data.notifications_non_lues||0, color:'#dc2626', sub:'non lues' },
                            ];
                        } else {
                            this.dashboardStats = [
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>', label:'Dossiers', value:data.credits?.total||0, color:'#1a73e8', sub:`${data.credits?.en_attente||0} en attente` },
                                { iconSvg:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>', label:'Approuvés', value:data.credits?.approuvees||0, color:'#059669' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M12 1v22M17 5l-5-4-5 4"/></svg>', label:'Collecte', value:this.formatMoney(data.collecte?.total_rembourse||0), color:'#7c3aed' },
                                { iconSvg:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>', label:'Chats ouverts', value:data.support?.conversations_ouvertes||0, color:'#0891b2' },
                            ];
                        }
                        const loanUrl = this.user.role === 'ADMIN' ? '/api/loans/' : '/api/loans/mine/';
                        const allLoans = await this.api(loanUrl);
                        this.recentLoans = (Array.isArray(allLoans) ? allLoans : allLoans.results || []).slice(0, 10);
                    } catch(e) { console.error(e); }
                },
                async loadLoans() {
                    try {
                        const url = this.user.role === 'CLIENT' ? '/api/loans/mine/' : '/api/loans/';
                        const d = await this.api(url);
                        this.loans = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async loadRepayments() {
                    try {
                        const d = await this.api('/api/repayments/');
                        this.repayments = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async loadInsurance() {
                    try {
                        const prod = await this.api('/api/insurance/products/');
                        this.insuranceProducts = Array.isArray(prod) ? prod : prod.results || [];
                        const d = await this.api('/api/insurance/policies/mine/');
                        this.myPolicies = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async loadChat() {
                    try {
                        const d = await this.api('/api/chat/conversations/');
                        this.conversations = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async selectChat(c) {
                    this.selectedChat = c;
                    if (this.chatSocket) this.chatSocket.close();
                    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    this.chatSocket = new WebSocket(`${wsProto}//${window.location.host}/ws/chat/${c.id}/?token=${encodeURIComponent(this.token)}`);
                    this.chatSocket.onmessage = (e) => {
                        const d = JSON.parse(e.data);
                        if (d.type === 'new_message') {
                            this.chatMessages.push({ id: Date.now(), message: d.message, sender: d.sender, sender_name: d.sender_name, timestamp: d.timestamp });
                            this.$nextTick(() => { const box = this.$refs.chatBox; if (box) box.scrollTop = box.scrollHeight; });
                        } else if (d.type === 'user_status') {
                            this.$set(this.chatOnline, d.user_id, d.status);
                        } else if (d.type === 'typing') {
                            const arr = this.chatTyping.filter(x => x.user_id !== d.user_id);
                            if (d.typing) arr.push({ user_id: d.user_id, sender_name: d.sender_name });
                            this.chatTyping = arr;
                        }
                    };
                    this.chatSocket.onopen = () => { this.chatTyping = []; };
                    const msgs = await this.api(`/api/chat/conversations/${c.id}/messages/`);
                    this.chatMessages = Array.isArray(msgs) ? msgs : msgs.results || [];
                    this.$nextTick(() => { const box = this.$refs.chatBox; if (box) box.scrollTop = box.scrollHeight; });
                },
                sendChat() {
                    if (!this.chatInput.trim() || !this.selectedChat) return;
                    if (this.chatSocket && this.chatSocket.readyState === WebSocket.OPEN) {
                        this.chatSocket.send(JSON.stringify({message: this.chatInput}));
                        this.chatInput = '';
                        this.chatSocket.send(JSON.stringify({typing: false}));
                    } else {
                        fetch(`/api/chat/conversations/${this.selectedChat.id}/send/`, {
                            method:'POST', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'},
                            body: JSON.stringify({message: this.chatInput})
                        }).then(() => this.loadChat());
                        this.chatInput = '';
                    }
                },
                async newChat() {
                    const r = await fetch('/api/chat/conversations/', { method:'POST', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body:'{}' });
                    if (r.ok) { const c = await r.json(); this.conversations.unshift(c); this.selectChat(c); }
                },
                async loadNotifications() {
                    try {
                        const d = await this.api('/api/notifications/');
                        this.notificationsList = Array.isArray(d) ? d : d.results || [];
                        this.notifications = this.notificationsList.slice(0, 10);
                    } catch(e) { console.error(e); }
                },
                async markRead(n) {
                    await fetch(`/api/notifications/${n.id}/read/`, { method:'PATCH', headers:{'Authorization':`Bearer ${this.token}`} });
                    n.lu = true;
                },
                async markAllRead() {
                    await fetch('/api/notifications/mark-all-read/', { method:'POST', headers:{'Authorization':`Bearer ${this.token}`} });
                    this.notificationsList.forEach(n => n.lu = true);
                    this.notif = { show: true, message: 'Toutes marquées comme lues', type: 'success' };
                    setTimeout(() => this.notif.show = false, 3000);
                },
                async loadUsers() {
                    try {
                        const d = await this.api('/api/auth/users/');
                        this.users = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async loadAudit() {
                    try {
                        const d = await this.api('/api/common/audit/');
                        this.auditLogs = Array.isArray(d) ? d : d.results || [];
                    } catch(e) { console.error(e); }
                },
                async submitLoan() {
                    try {
                        const r = await fetch('/api/loans/', { method:'POST', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body:JSON.stringify(this.loanForm) });
                        if (r.ok) {
                            this.showLoanForm = false;
                            this.loanForm = { montant_demande: '', duree_mois: 12, motif: '', revenu_mensuel: '' };
                            this.loadLoans();
                            this.notif = { show: true, message: 'Demande de crédit soumise avec succès', type: 'success' };
                            setTimeout(() => this.notif.show = false, 3000);
                        }
                    } catch(e) { this.notif = { show: true, message: 'Erreur lors de la soumission', type: 'error' }; }
                },
                async submitInsurance() {
                    try {
                        const r = await fetch('/api/insurance/policies/', { method:'POST', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body:JSON.stringify(this.insuranceForm) });
                        if (r.ok) {
                            this.showInsuranceForm = false;
                            this.insuranceForm = { produit_id: '' };
                            this.loadInsurance();
                            this.notif = { show: true, message: 'Assurance souscrite avec succès', type: 'success' };
                            setTimeout(() => this.notif.show = false, 3000);
                        }
                    } catch(e) { this.notif = { show: true, message: 'Erreur lors de la souscription', type: 'error' }; }
                },
                async renderCharts() {
                    if (!window.Chart) return;
                    const baseOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#666' } } }, scales: { x: { ticks: { color: '#999' } }, y: { ticks: { color: '#999' } } } };
                    const colors = ['#1a73e8','#059669','#d97706','#dc2626','#7c3aed','#0891b2'];
                    if (document.getElementById('chartLoans')) {
                        new Chart(document.getElementById('chartLoans'), { type:'bar', data:{ labels:this.chartData.months, datasets:[{ label:'Crédits', data:this.chartData.credits_par_mois, backgroundColor:colors[0], borderRadius:4 }] }, options:{...baseOpts, plugins:{...baseOpts.plugins, title:{display:true, text:'Crédits par mois', color:'var(--text-primary)'}}} });
                    }
                    if (document.getElementById('chartRepayments')) {
                        new Chart(document.getElementById('chartRepayments'), { type:'line', data:{ labels:this.chartData.months, datasets:[{ label:'Remboursements (FCFA)', data:this.chartData.remboursements_par_mois, borderColor:colors[1], backgroundColor:colors[1]+'33', fill:true, tension:.3 }] }, options:{...baseOpts, plugins:{...baseOpts.plugins, title:{display:true, text:'Remboursements par mois', color:'var(--text-primary)'}}} });
                    }
                    if (document.getElementById('chartStatus')) {
                        const st = this.chartData.repartition_statuts || [];
                        new Chart(document.getElementById('chartStatus'), { type:'doughnut', data:{ labels:st.map(s=>s.label), datasets:[{ data:st.map(s=>s.value), backgroundColor:colors.slice(0,st.length) }] }, options:{...baseOpts, plugins:{...baseOpts.plugins, title:{display:true, text:'Statuts des crédits', color:'var(--text-primary)'}}} });
                    }
                },
                async viewLoan(l) {
                    try {
                        const d = await this.api(`/api/loans/${l.id}/`);
                        const sched = await this.api(`/api/loans/${l.id}/schedule/`);
                        const hist = await this.api(`/api/loans/${l.id}/history/`);
                        this.selectedLoan = {
                            ...d,
                            amortization_schedule: Array.isArray(sched) ? sched : sched.results || [],
                            status_history: Array.isArray(hist) ? hist : hist.results || []
                        };
                    } catch(e) { }
                },
                debouncedSearch() {
                    clearTimeout(this.searchTimeout);
                    if (!this.searchQuery || this.searchQuery.length < 2) { this.searchResults = []; return; }
                    this.searchTimeout = setTimeout(async () => {
                        try {
                            const d = await this.api(`/api/common/search/?q=${encodeURIComponent(this.searchQuery)}`);
                            const arr = Array.isArray(d) ? d : d.results || [];
                            this.searchResults = arr.map(r => ({
                                ...r,
                                label: r.object_repr || `#${r.object_id} ${r.model_name}`,
                                type: r.model_name,
                                detail: `${r.action} - ${r.user_details?.username || ''}`
                            })).slice(0, 10);
                        } catch(e) { this.searchResults = []; }
                    }, 300);
                },
                navigateToSearchResult(r) {
                    if (r.model_name === 'LoanApplication' || r.model_name === 'credit') {
                        this.navigate('loans');
                    } else if (r.model_name === 'Policy' || r.model_name === 'assurance') {
                        this.navigate('insurance');
                    } else if (r.model_name === 'Conversation' || r.model_name === 'chat') {
                        this.navigate('chat');
                    }
                    this.searchQuery = ''; this.searchResults = [];
                },
                async exportCSV() {
                    try {
                        const r = await fetch('/api/loans/export/csv/', { headers:{'Authorization':`Bearer ${this.token}`} });
                        if (!r.ok) throw new Error();
                        const blob = await r.blob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = 'credits.csv'; a.click();
                        URL.revokeObjectURL(url);
                        this.notif = { show: true, message: 'CSV exporté avec succès', type: 'success' };
                    } catch(e) {
                        this.notif = { show: true, message: 'Erreur export CSV', type: 'error' };
                    }
                    setTimeout(() => this.notif.show = false, 3000);
                },
                canTransition(loan, action) {
                    if (!loan) return false;
                    const s = loan.statut;
                    if (this.user.role === 'ADMIN') {
                        if (action === 'agent') return s === 'SOUMISE';
                        if (action === 'approve') return s === 'EN_ANALYSE';
                        if (action === 'reject') return s === 'SOUMISE' || s === 'EN_ANALYSE';
                        if (action === 'disburse') return s === 'APPROUVEE';
                    }
                    if (this.user.role === 'AGENT') {
                        if (action === 'agent') return s === 'SOUMISE';
                        if (action === 'approve') return s === 'EN_ANALYSE';
                        if (action === 'reject') return s === 'SOUMISE' || s === 'EN_ANALYSE';
                    }
                    return false;
                },
                async updateLoanStatus(loan, newStatus) {
                    if (newStatus === 'REJETEE') {
                        this.confirm = { show:true, title:'Rejeter le crédit', message:'Êtes-vous sûr de vouloir rejeter cette demande de crédit ?', danger:true, onConfirm: () => this._doUpdateLoanStatus(loan, newStatus) };
                        return;
                    }
                    this._doUpdateLoanStatus(loan, newStatus);
                },
                async _doUpdateLoanStatus(loan, newStatus) {
                    const comment = prompt(`Commentaire pour le passage à ${newStatus} :`);
                    if (comment === null) return;
                    try {
                        const r = await fetch(`/api/loans/${loan.id}/status/`, {
                            method:'PATCH',
                            headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'},
                            body: JSON.stringify({ statut: newStatus, commentaire: comment || '' })
                        });
                        if (r.ok) {
                            this.notif = { show: true, message: `Statut mis à jour : ${newStatus}`, type: 'success' };
                            setTimeout(() => this.notif.show = false, 3000);
                            this.selectedLoan = null;
                            this.loadLoans();
                        } else {
                            const d = await r.json();
                            this.notif = { show: true, message: d.error || d.statut?.[0] || 'Erreur de mise à jour', type: 'error' };
                            setTimeout(() => this.notif.show = false, 3000);
                        }
                    } catch(e) {
                        this.notif = { show: true, message: 'Erreur réseau', type: 'error' };
                        setTimeout(() => this.notif.show = false, 3000);
                    }
                },
                async assignAgent(conv) {
                    try {
                        const r = await fetch(`/api/chat/conversations/${conv.id}/assign/`, {
                            method:'PATCH',
                            headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'},
                            body: JSON.stringify({})
                        });
                        if (r.ok) {
                            this.notif = { show: true, message: 'Conversation assignée', type: 'success' };
                            setTimeout(() => this.notif.show = false, 3000);
                            this.loadChat();
                        }
                    } catch(e) {}
                },
                connectNotificationSocket() {
                    if (this.notifSocket) return;
                    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    try {
                        this.notifSocket = new WebSocket(`${wsProto}//${window.location.host}/ws/notifications/?token=${encodeURIComponent(this.token)}`);
                        this.notifSocket.onmessage = (e) => {
                            const d = JSON.parse(e.data);
                            if (d.type === 'new_notification') {
                                this.notificationsList.unshift(d.notification);
                                this.notifications = this.notificationsList.slice(0, 10);
                            }
                        };
                        this.notifSocket.onclose = () => { this.notifSocket = null; setTimeout(() => this.connectNotificationSocket(), 5000); };
                    } catch(e) {}
                },
                async closeConversation(conv) {
                    this.confirm = { show:true, title:'Fermer la conversation', message:'Êtes-vous sûr de vouloir fermer cette conversation ?', danger:false, onConfirm: async () => {
                        try {
                            const r = await fetch(`/api/chat/conversations/${conv.id}/close/`, { method:'PATCH', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body: JSON.stringify({}) });
                            if (r.ok) {
                                this.notif = { show: true, message: 'Conversation fermée', type: 'success' };
                                setTimeout(() => this.notif.show = false, 3000);
                                conv.status = 'FERMEE';
                                this.loadChat();
                            }
                        } catch(e) {}
                    }};
                },
                async updateProfile() {
                    try {
                        const r = await fetch('/api/auth/profile/', { method:'PATCH', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body:JSON.stringify({first_name:this.profileForm.first_name, last_name:this.profileForm.last_name}) });
                        if (r.ok) {
                            const d = await r.json();
                            this.user.first_name = d.first_name; this.user.last_name = d.last_name;
                            this.user.initials = (d.first_name?.[0]||'') + (d.last_name?.[0]||'');
                            this.notif = { show:true, message:'Profil mis à jour', type:'success' };
                        } else { this.notif = { show:true, message:'Erreur de mise à jour', type:'error' }; }
                        setTimeout(() => this.notif.show = false, 3000);
                    } catch(e) {}
                },
                async changePassword() {
                    this.passwordError = '';
                    if (this.passwordForm.new_password !== this.passwordForm.confirm_password) { this.passwordError = 'Les mots de passe ne correspondent pas'; return; }
                    if (this.passwordForm.new_password.length < 6) { this.passwordError = 'Minimum 6 caractères'; return; }
                    try {
                        const r = await fetch('/api/auth/change-password/', { method:'POST', headers:{'Authorization':`Bearer ${this.token}`, 'Content-Type':'application/json'}, body:JSON.stringify({old_password:this.passwordForm.old_password, new_password:this.passwordForm.new_password}) });
                        const d = await r.json();
                        if (r.ok) { this.notif = { show:true, message:'Mot de passe modifié', type:'success' }; this.passwordForm = { old_password:'', new_password:'', confirm_password:'' }; }
                        else { this.passwordError = d.error || 'Erreur'; }
                        setTimeout(() => this.notif.show = false, 3000);
                    } catch(e) { this.passwordError = 'Erreur réseau'; }
                },
                statusClass(s) {
                    const map = { 'SOUMISE':'pending','EN_ANALYSE':'pending','APPROUVEE':'approved','REJETEE':'rejected','DECAISSEE':'active','ACTIVE':'active','EXPIREE':'closed','OUVERTE':'active','FERMEE':'closed' };
                    return map[s] || 'pending';
                },
                formatMoney(v) { return new Intl.NumberFormat('fr-FR').format(v || 0) + ' FCFA'; },
                formatDate(d) { if (!d) return ''; return new Date(d).toLocaleDateString('fr-FR'); },
                formatTime(d) { if (!d) return ''; return new Date(d).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}); },
            },
            mounted() {
                document.documentElement.setAttribute('data-theme', this.theme);
                if (this.token) { this.loadAll(); this.startTokenRefresh(); }
            },
            startTokenRefresh() {
                if (this._refreshTimer) clearInterval(this._refreshTimer);
                this._refreshTimer = setInterval(async () => {
                    if (!this.refresh) return;
                    try {
                        const r = await fetch('/api/auth/token/refresh/', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({refresh: this.refresh}) });
                        if (!r.ok) throw new Error();
                        const d = await r.json();
                        this.token = d.access;
                        localStorage.setItem('token', this.token);
                    } catch(e) {
                        this.notif = { show: true, message: 'Session expirée, veuillez vous reconnecter', type: 'error' };
                        setTimeout(() => this.notif.show = false, 5000);
                        setTimeout(() => this.logout(), 2000);
                    }
                }, 600000);
            }
        });
    </script>
</body>
</html>

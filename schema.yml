components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - STATUS_CHANGE
      - PAYMENT
      - ASSIGN
      type: string
      description: |-
        * `CREATE` - Création
        * `UPDATE` - Modification
        * `DELETE` - Suppression
        * `LOGIN` - Connexion
        * `STATUS_CHANGE` - Changement de statut
        * `PAYMENT` - Paiement
        * `ASSIGN` - Assignation
    Agent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        matricule:
          type: string
          maxLength: 50
        region:
          type: string
          maxLength: 100
      required:
      - id
      - matricule
      - region
      - user
    AgentCreate:
      type: object
      properties:
        user_id:
          type: integer
          writeOnly: true
        matricule:
          type: string
          maxLength: 50
        region:
          type: string
          maxLength: 100
      required:
      - matricule
      - region
      - user_id
    AmortizationSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mensualite:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date_echeance:
          type: string
          format: date
        capital_restant:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        part_capital:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        part_interet:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        est_paye:
          type: boolean
        numero_mensualite:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        loan:
          type: integer
      required:
      - capital_restant
      - date_echeance
      - id
      - loan
      - mensualite
      - numero_mensualite
      - part_capital
      - part_interet
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_details:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        model_name:
          type: string
          title: Modèle
          maxLength: 100
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          title: ID objet
        object_repr:
          type: string
          title: Représentation
          maxLength: 255
        details:
          type: string
          title: Détails
        ip_address:
          type: string
          nullable: true
          title: Adresse IP
        timestamp:
          type: string
          format: date-time
          readOnly: true
          title: Date
        user:
          type: integer
          nullable: true
          title: Utilisateur
      required:
      - action
      - id
      - model_name
      - timestamp
      - user_details
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 6
      required:
      - new_password
      - old_password
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        profession:
          type: string
          maxLength: 100
        revenu_mensuel:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        score_credit:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        date_naissance:
          type: string
          format: date
        numero_piece:
          type: string
          maxLength: 50
      required:
      - date_naissance
      - id
      - numero_piece
      - profession
      - revenu_mensuel
      - user
    ClientCreate:
      type: object
      properties:
        user_id:
          type: integer
          writeOnly: true
        profession:
          type: string
          maxLength: 100
        revenu_mensuel:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        date_naissance:
          type: string
          format: date
        numero_piece:
          type: string
          maxLength: 50
      required:
      - date_naissance
      - numero_piece
      - profession
      - revenu_mensuel
      - user_id
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        agent_name:
          type: string
          readOnly: true
          nullable: true
        last_message:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_mise_a_jour:
          type: string
          format: date-time
          readOnly: true
        client:
          type: integer
        agent:
          type: integer
          nullable: true
      required:
      - agent_name
      - client
